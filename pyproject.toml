[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaldash"
version = "0.1.0"
description = "Compare agent versions from run records, with confidence intervals, so noise is not mistaken for progress."
requires-python = ">=3.10"
dependencies = []  # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evaldash = "evaldash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
